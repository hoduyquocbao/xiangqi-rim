[package]
name = "xiangrust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "High-performance Xiangqi AI Engine in Rust 2021"

[dependencies]
wgpu = "24.0.0"
pollster = "0.4.0"
opencl3 = "0.9.0"
rayon = "1.10"
libc = "0.2"

[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
overflow-checks = false
incremental = true

