name: CI/CD Dual Deploy (GitHub -> HuggingFace Space)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  verify-and-sync:
    name: Verify & Sync to HuggingFace Space
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🔍 Verify Python Scripts Syntax
        run: |
          python -m py_compile app.py scripts/*.py

      - name: 🦀 Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: ⚡ Cargo Check Release Engine
        run: |
          cargo check --release --example 23_jrcp3_ram64g_miner

      - name: 🚀 Sync & Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: "hoduyquocbao/xiangqi-rim"
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "⚠️ Secret HF_TOKEN chưa được cài đặt trong GitHub Repository Secrets."
            echo "💡 Thêm HF_TOKEN vào: GitHub Repo -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          git config --global user.email "bot@xiangqi-r1.ai"
          git config --global user.name "Xiangqi-R1 CI Bot"
          git remote add space https://hoduyquocbao:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO 2>/dev/null || git remote set-url space https://hoduyquocbao:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO
          git push space HEAD:main --force
          echo "✅ Đã đồng bộ CI/CD tự động lên HuggingFace Space!"
