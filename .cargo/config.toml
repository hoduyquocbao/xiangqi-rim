# Cấu hình biên dịch tối ưu cho Xiangqi-RIM trên macOS / Unix
[build]
# Tận dụng toàn bộ nhân CPU vật lý cho biên dịch
jobs = 4

[target.x86_64-apple-darwin]
# Tối ưu hóa tập lệnh native CPU Intel Core i5 (AVX2, FMA, BMI2) và dead code stripping
rustflags = [
    "-C", "target-cpu=native",
    "-C", "link-arg=-Wl,-dead_strip",
]

[target.aarch64-apple-darwin]
# Tối ưu hóa cho Apple Silicon M-series nếu chuyển máy
rustflags = [
    "-C", "target-cpu=native",
    "-C", "link-arg=-Wl,-dead_strip",
]
